<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>모바일 포커 카드 4장</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #f3ecd2; color: #fff;
      font-family: "Georgia", serif;
      overflow: hidden; touch-action: none;
    }
    body {
      display: flex; justify-content: center; align-items: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      min-height: 100vh; min-height: 100dvh;
    }

    .card-wrapper {
      position: relative;
      width: min(88vw, 350px, calc((100dvh - 112px) * 5 / 7));
      aspect-ratio: 5 / 7;
      height: auto;
      transition: transform 0.26s ease, opacity 0.26s ease;
    }
    @media (max-width: 360px) {
      .card-wrapper { width: min(90vw, calc((100dvh - 104px) * 5 / 7)); }
    }
    .card-wrapper.slide-out-right { animation: liftRight 0.4s ease-in forwards; }
    .card-wrapper.enter-from-left { transition: none !important; transform: translateX(-35%); opacity: 0; }
    .card-wrapper.slide-out-left { animation: liftLeft 0.4s ease-in forwards; }
    @keyframes liftRight {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      35% { transform: translate(0, 0) scale(1.18); opacity: 1; }
      100% { transform: translate(65%, 0) scale(1.18); opacity: 0; }
    }
    @keyframes liftLeft {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      35% { transform: translate(0, 0) scale(1.18); opacity: 1; }
      100% { transform: translate(-65%, 0) scale(1.18); opacity: 0; }
    }
    .card-wrapper.enter-from-right { transition: none !important; transform: translateX(35%); opacity: 0; }

    .card-scene {
      position: relative; width: 100%; height: 100%;
      perspective: 1200px; cursor: pointer;
      -webkit-tap-highlight-color: transparent; touch-action: none;
    }
    .card-flipper {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d; transform: rotateY(180deg); transition: transform 0.55s ease; pointer-events: none;
    }
    .card-scene.is-flipped .card-flipper { transform: rotateY(0deg); }

    .card-face {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 22px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      padding: clamp(10px, 3.5vw, 16px); background: #fff; border: 3px solid #dc2626;
      box-shadow: 0 14px 30px rgba(0,0,0,0.45); user-select: none;
    }

    /* 뒷면: 빨강 바탕 + 흰색 테두리/마름모 무늬 */
    .card-back { background: #fff; border-color: #000; }
    .card-back-inner { width: 100%; height: 100%; background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; }

    /* 앞면: 흰색 바탕 + 빨강 글자 */
    .card-front { color: #000; border-color: #000; transform: rotateY(180deg); }
    .card-front-inner {
      position: relative; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: clamp(28px, 8vw, 44px) 12px clamp(34px, 9vw, 52px); text-align: center;
    }
    .corner {
      position: absolute; display: flex; flex-direction: column; align-items: center;
      font-weight: bold; font-size: 1.8rem; line-height: 1.05;
    }
    .top-left { top: 4px; left: 4px; }
    .bottom-right { bottom: 4px; right: 4px; transform: rotate(180deg); }
    .center-pip { font-size: 5.2rem; line-height: 1; }
    .card-note {
      margin-top: 12px; max-width: 88%; color: #b91c1c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.9rem; font-weight: 600; line-height: 1.35; word-break: keep-all;
    }
    .card-note.empty { display: none; }
    .center-pip, .corner { display: none; }
    .hanja {
      font-size: clamp(5rem, 23vw, 8rem); line-height: 1; font-weight: 700;
      font-family: "Noto Serif KR", "Noto Serif CJK KR", "Songti SC", "Batang", serif;
    }
    .hun {
      font-size: clamp(1.65rem, 7vw, 2.4rem); font-weight: 700; color: #000;
      text-align: center; word-break: keep-all;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .en {
      margin-top: 14px; padding: 0 10px; text-align: center; word-break: keep-all;
      font-size: clamp(1.1rem, 4.8vw, 1.6rem); font-style: italic; letter-spacing: .04em; color: #6b5233;
      font-family: Georgia, "Times New Roman", serif;
    }
    #startScreen.en-ui h1 { font-size: clamp(1.5rem, 7vw, 2rem); letter-spacing: .06em; line-height: 1.25; max-width: 86vw; }
    #startScreen.en-ui h1::after { letter-spacing: .5em; }
    .lang-row { display: flex; gap: 12px; justify-content: center; margin-top: 4px; }
    .lang-btn {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-width: 96px; padding: 10px 14px 8px; cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: .85rem; font-weight: 700; color: #715735;
      background: rgba(255,255,255,.45); border: 2px solid rgba(107,82,51,.28); border-radius: 18px;
      -webkit-tap-highlight-color: transparent; transition: all .16s ease;
    }
    .lang-btn .flag { font-size: 2rem; line-height: 1; filter: grayscale(1); opacity: .55; transition: all .16s ease; }
    .lang-btn.on { background: #dcebd2; border-color: #5b754b; color: #182016; box-shadow: 0 4px 10px rgba(42,58,35,.18); }
    .lang-btn.on .flag { filter: none; opacity: 1; }
    .lang-btn:active { transform: translateY(2px); }
    #startScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px;
      background: #f3ecd2; color: #000; touch-action: manipulation;
    }
    #startScreen { padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom)); }
    #startScreen h1 { font-size: clamp(2rem, 9vw, 2.6rem); letter-spacing: 0.2em; margin-bottom: 12px; }
    .menu-btn {
      width: min(220px, 82vw); min-height: 54px; padding: 14px 0; font-size: clamp(1.1rem, 5vw, 1.3rem); font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #000; background: #fff; border: 3px solid #000; border-radius: 14px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .menu-btn:active { background: #e5e5e5; }
    #status { min-height: 1.4em; font-size: 0.95rem; color: #444; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #homeBtn {
      position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 8px; z-index: 5;
      padding: 9px 16px; min-height: 42px; font-size: 0.9rem; font-weight: 700; color: #000; background: #fff;
      border: 2px solid #000; border-radius: 10px; cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* ---- 전통 한지 · 고급 서예풍 테마 ---- */
    html, body {
      background-color: #d8c8a3;
      background-image:
        radial-gradient(ellipse at 18% 12%, rgba(255,255,235,.52), transparent 42%),
        radial-gradient(ellipse at 82% 88%, rgba(117,83,42,.13), transparent 48%),
        repeating-linear-gradient(7deg, rgba(112,82,43,.025) 0 1px, transparent 1px 5px),
        linear-gradient(135deg, #e9dfc5 0%, #d9c9a6 48%, #cdbb94 100%);
    }
    body { color: #292318; }
    .card-wrapper { filter: drop-shadow(0 18px 22px rgba(49, 35, 17, .22)); }
    .card-face {
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 10px 24px rgba(57,42,20,.2);
    }
    .card-face.card-back, .card-face.card-front {
      background-color: #fff;
      background-image:
        radial-gradient(ellipse at 20% 18%, rgba(255,255,255,.95), transparent 45%),
        radial-gradient(ellipse at 85% 82%, rgba(120,105,85,.035), transparent 50%),
        repeating-linear-gradient(0deg, rgba(106,82,47,.018) 0 1px, transparent 1px 4px),
        linear-gradient(145deg, #fff, #fafafa);
      border: 3px solid #493923;
    }
    .card-face::before {
      content: ""; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px solid rgba(133, 101, 54, .58); border-radius: 12px; pointer-events: none;
    }
    .card-face::after {
      content: " "; position: absolute; inset: 15px; border: 1px solid rgba(255,255,255,.55);
      border-radius: 8px; pointer-events: none;
    }
    .card-front-inner { z-index: 1; }
    .hanja {
      color: #17120f;
      /* 붓글씨 계열 글꼴이 설치된 기기에서는 우선 사용하고, 없으면 묵직한 명조체로 대체 */
      font-family: "Nanum Brush Script", "KCC-Ganpan", "HCR Batang", "Noto Serif KR",
                   "Nanum Myeongjo", "Noto Serif CJK KR", "Batang", "KaiTi", "STKaiti", serif;
      font-weight: 900;
      letter-spacing: .015em;
      -webkit-text-stroke: .7px rgba(23, 18, 15, .82);
      text-shadow:
        .7px .5px 0 rgba(23, 18, 15, .55),
        1.4px 1px 0 rgba(23, 18, 15, .28),
        0 3px 2px rgba(62, 39, 22, .18);
      filter: contrast(1.12);
    }
    .hun {
      color: #34291d;
      letter-spacing: .08em;
      font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
    }
    .hun::after {
      content: ""; display: block; width: 54px; height: 2px; margin: 18px auto 0;
      border-radius: 2px; background: linear-gradient(90deg, transparent, #9b3028 18%, #9b3028 82%, transparent);
    }
    #startScreen {
      background-color: #d8c8a3;
      background-image:
        radial-gradient(ellipse at 18% 12%, rgba(255,255,235,.52), transparent 42%),
        repeating-linear-gradient(7deg, rgba(112,82,43,.025) 0 1px, transparent 1px 5px),
        linear-gradient(135deg, #e9dfc5 0%, #d9c9a6 48%, #cdbb94 100%);
    }
    #startScreen h1 {
      color: #302316; font-size: 2.6rem; text-align: center;
      font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
      letter-spacing: .24em; text-shadow: 0 2px 0 rgba(255,255,255,.45);
    }
    #startScreen h1::after {
      content: "千字文"; display: block; margin-top: 12px; padding-top: 10px;
      border-top: 1px solid rgba(117,83,42,.45); font-size: 1rem; font-weight: 400;
      letter-spacing: .65em; color: #8a392e;
    }
    .menu-btn {
      border-radius: 8px; border: 1px solid #6b5233;
      background: linear-gradient(180deg, #fff, #f5f5f5);
      color: #382a1b; box-shadow: 0 4px 0 #765b38, 0 7px 13px rgba(60,42,19,.12);
      transition: transform .1s ease, box-shadow .1s ease;
    }
    .menu-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #765b38; background: #ededed; }
    #startBtn {
      background: linear-gradient(180deg, #9d382d, #76251f); color: #fff8e9;
      border-color: #64231d; box-shadow: 0 4px 0 #552019, 0 7px 13px rgba(60,25,16,.18);
    }
    #startBtn:active { background: #76251f; }
    #status { color: #715735; }
    #homeBtn {
      border-radius: 7px; border: 1px solid #6b5233; box-shadow: 0 2px 0 #765b38;
      background: linear-gradient(180deg, #fff, #f5f5f5); color: #382a1b;
    }
    @media (max-height: 560px) {
      #startScreen { gap: 9px; }
      #startScreen h1 { margin-bottom: 2px; }
      .menu-btn { min-height: 44px; padding: 9px 0; }
      .card-wrapper { width: min(62vw, calc((100dvh - 76px) * 5 / 7)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  
    /* 버튼 디자인: 참고 이미지의 1번 스타일 */
    .menu-btn, #homeBtn {
      color: #182016;
      background: #dcebd2;
      border: 1px solid rgba(91, 117, 75, .22);
      border-radius: 26px;
      box-shadow: 0 7px 14px rgba(42, 58, 35, .18),
                  inset 0 1px 0 rgba(255,255,255,.72);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .menu-btn {
      min-height: 68px;
      padding: 16px 22px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    #homeBtn {
      background: #dcebd2;
      border-radius: 18px;
      box-shadow: 0 4px 10px rgba(42, 58, 35, .16);
    }
    .menu-btn:active, #homeBtn:active {
      background: #cfe2c3;
      transform: translateY(2px);
      box-shadow: 0 3px 7px rgba(42, 58, 35, .16);
    }
    @media (prefers-reduced-motion: reduce) {
      .menu-btn, #homeBtn { transition: none; }
    }

    /* 갈색 시작 버튼을 흰색으로 변경 */
    #startBtn {
      background: linear-gradient(180deg, #ffffff, #f7f7f7);
      color: #182016;
      border-color: rgba(91, 117, 75, .22);
      box-shadow: 0 7px 14px rgba(42, 58, 35, .18),
                  inset 0 1px 0 rgba(255,255,255,.9);
    }
    #startBtn:active { background: #ededed; }

  
    /* ---- 시작 화면: Google Material 3 스타일 ---- */
    #startScreen {
      --m3-surface: #f8f9fa;
      --m3-on-surface: #202124;
      --m3-on-surface-variant: #5f6368;
      --m3-primary: #1a73e8;
      --m3-on-primary: #ffffff;
      --m3-primary-container: #d3e3fd;
      --m3-on-primary-container: #041e49;
      --m3-outline: #747775;
      --m3-font: "Google Sans", "Product Sans", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, "Segoe UI", sans-serif;
      background: var(--m3-surface);
      background-image: none;
      color: var(--m3-on-surface);
      font-family: var(--m3-font);
      gap: 0;
    }
    #startScreen .m3-logo {
      width: 72px; height: 72px; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: var(--m3-primary-container); color: var(--m3-on-primary-container);
      font-size: 2.1rem; line-height: 1;
      font-family: "Noto Serif KR", "Noto Serif CJK KR", "Songti SC", "Batang", serif; font-weight: 700;
    }
    #startScreen h1,
    #startScreen.en-ui h1 {
      margin: 0 0 40px; max-width: 86vw;
      font-family: var(--m3-font); font-weight: 500; color: var(--m3-on-surface);
      font-size: clamp(2rem, 9vw, 2.5rem); line-height: 1.2; letter-spacing: 0; text-shadow: none;
    }
    #startScreen.en-ui h1 { font-size: clamp(1.5rem, 7vw, 1.85rem); }
    #startScreen h1::after,
    #startScreen.en-ui h1::after {
      content: "千字文"; display: block; margin-top: 8px; padding: 0; border: 0;
      font-size: .95rem; font-weight: 400; letter-spacing: .4em; text-indent: .4em; color: var(--m3-on-surface-variant);
    }
    #startScreen .m3-actions {
      width: min(320px, 86vw); display: flex; flex-direction: column; gap: 12px;
    }
    #startScreen .menu-btn {
      width: 100%; min-height: 56px; padding: 0 24px; border: 0; border-radius: 28px;
      font-family: var(--m3-font); font-size: 1rem; font-weight: 500; letter-spacing: .01em;
      cursor: pointer; transition: box-shadow .2s ease, background-color .2s ease, transform .1s ease;
    }
    /* 시작: Filled button */
    #startScreen #startBtn {
      background: var(--m3-primary); color: var(--m3-on-primary);
      box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
    }
    #startScreen #startBtn:hover { background: #1b66c9; box-shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15); }
    #startScreen #startBtn:active { background: #185abc; box-shadow: 0 1px 2px rgba(60,64,67,.3); transform: none; }
    /* 저장: Filled tonal button */
    #startScreen #saveBtn {
      background: var(--m3-primary-container); color: var(--m3-on-primary-container); box-shadow: none;
    }
    #startScreen #saveBtn:hover { background: #c4d9fb; box-shadow: 0 1px 2px rgba(60,64,67,.3); }
    #startScreen #saveBtn:active { background: #b6cff8; box-shadow: none; transform: none; }
    /* 초기화: Outlined button */
    #startScreen #resetBtn {
      background: transparent; color: var(--m3-primary); box-shadow: inset 0 0 0 1px #dadce0;
    }
    #startScreen #resetBtn:hover { background: rgba(26,115,232,.08); }
    #startScreen #resetBtn:active { background: rgba(26,115,232,.16); transform: none; }
    #startScreen .menu-btn:focus-visible,
    #startScreen .lang-btn:focus-visible { outline: 3px solid rgba(26,115,232,.45); outline-offset: 2px; }

    /* 언어: Segmented button */
    #startScreen .lang-row {
      display: inline-flex; gap: 0; margin-top: 32px; overflow: hidden;
      border: 1px solid var(--m3-outline); border-radius: 20px;
    }
    #startScreen .lang-btn {
      flex-direction: row; gap: 8px; min-width: 116px; height: 40px; padding: 0 16px;
      justify-content: center; border: 0; border-radius: 0; box-shadow: none;
      background: transparent; color: var(--m3-on-surface);
      font-family: var(--m3-font); font-size: .875rem; font-weight: 500; letter-spacing: .01em;
      transition: background-color .15s ease;
    }
    #startScreen .lang-btn + .lang-btn { border-left: 1px solid var(--m3-outline); }
    #startScreen .lang-btn .flag { display: none; }
    #startScreen .lang-btn:hover { background: rgba(32,33,36,.06); }
    #startScreen .lang-btn:active { transform: none; background: rgba(32,33,36,.12); }
    #startScreen .lang-btn.on { background: var(--m3-primary-container); color: var(--m3-on-primary-container); box-shadow: none; }
    #startScreen .lang-btn.on::before { content: "\2713"; font-size: 1rem; line-height: 1; }

    #startScreen #status {
      margin-top: 24px; min-height: 1.4em; max-width: 86vw; text-align: center;
      font-family: var(--m3-font); font-size: .875rem; letter-spacing: .01em; color: var(--m3-on-surface-variant);
    }
    @media (max-height: 640px) {
      #startScreen .m3-logo { display: none; }
      #startScreen h1, #startScreen.en-ui h1 { margin-bottom: 24px; }
      #startScreen .menu-btn { min-height: 48px; }
      #startScreen .lang-row { margin-top: 20px; }
      #startScreen #status { margin-top: 14px; }
    }
  
    /* ---- 카드 화면: Google Material 3 스타일 ---- */
    html, body { background-color: #f8f9fa; background-image: none; color: #202124; }
    .card-wrapper { filter: none; }
    .card-face,
    .card-face.card-back,
    .card-face.card-front {
      background: #ffffff; background-image: none; border: 0; border-radius: 28px;
      box-shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
    }
    .card-face::before, .card-face::after { content: none; display: none; }
    .hanja {
      color: #202124; font-weight: 700; letter-spacing: 0;
      -webkit-text-stroke: 0; text-shadow: none; filter: none;
    }
    .hun {
      color: #202124; font-weight: 500; letter-spacing: 0;
      font-family: "Google Sans", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, "Segoe UI", sans-serif;
    }
    .hun::after {
      width: 40px; height: 3px; margin: 20px auto 0; border-radius: 2px; background: #1a73e8;
    }
    .en {
      color: #5f6368; font-style: normal; letter-spacing: 0; font-weight: 400;
      font-family: "Google Sans", Roboto, "Noto Sans KR", -apple-system, "Segoe UI", sans-serif;
    }
    #homeBtn {
      min-height: 40px; padding: 0 20px; border: 0; border-radius: 20px;
      background: #d3e3fd; color: #041e49; box-shadow: none;
      font-family: "Google Sans", Roboto, "Noto Sans KR", -apple-system, "Segoe UI", sans-serif;
      font-size: .875rem; font-weight: 500; letter-spacing: .01em;
      transition: background-color .15s ease;
    }
    #homeBtn:hover { background: #c4d9fb; }
    #homeBtn:active { background: #b6cff8; transform: none; box-shadow: none; }
    #homeBtn:focus-visible { outline: 3px solid rgba(26,115,232,.45); outline-offset: 2px; }
  
    /* ---- 메인(언어 선택) 화면: Google Material 3 스타일 ---- */
    #landing {
      --m3-primary: #1a73e8; --m3-primary-container: #d3e3fd; --m3-on-primary-container: #041e49;
      --m3-on-surface: #202124; --m3-on-surface-variant: #5f6368;
      --m3-font: "Google Sans", "Product Sans", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, "Segoe UI", sans-serif;
      position: fixed; inset: 0; z-index: 12;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
      background: #f8f9fa; color: var(--m3-on-surface); font-family: var(--m3-font); touch-action: manipulation;
    }
    #landing .m3-logo {
      width: 88px; height: 88px; margin-bottom: 24px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: var(--m3-primary-container); color: var(--m3-on-primary-container);

    function renderStatus() {
      var en = isEnUI(), es = !!lang.es;
      if (statusKey === "allMoved" || statusKey === "noSaved") statusEl.textContent = S(statusKey);
      else if (statusKey === "reset") statusEl.textContent = es ? "Restablecido · " + mainDeck.length + " tarjetas" : en ? "Reset · " + mainDeck.length + " cards" : "초기화됨 · 천자문 " + mainDeck.length + "장";
      else statusEl.textContent = es ? ("Tarjetas " + mainDeck.length + " · Guardadas " + savedDeck.length) : en ? ("Cards " + mainDeck.length + " · Saved " + savedDeck.length) : ("천자문 " + mainDeck.length + "장 · 저장 " + savedDeck.length + "장");
    }
    function refreshStatus(key) { statusKey = key || "default"; renderStatus(); }
    function renderGuide() {
      var body = document.getElementById("guideBody");
      body.textContent = "";
      GUIDE[uiKey()].forEach(function (sec) {
        var card = document.createElement("section"); card.className = "g-card";
        var h = document.createElement("h3"); h.textContent = sec.h; card.appendChild(h);
        var ul = document.createElement("ul");
        sec.l.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
        card.appendChild(ul); body.appendChild(card);
      });
    }
    function openGuide() {
      var g = document.getElementById("guide");
      g.style.display = "flex"; document.getElementById("guideBody").scrollTop = 0;
      document.getElementById("guideClose").focus();
    }
    function closeGuide() { document.getElementById("guide").style.display = "none"; document.getElementById("guideBtn").focus(); }
    function applyUI() {
      var en = uiKey() !== "ko";
      document.documentElement.lang = uiKey();
      startScreen.classList.toggle("en-ui", en);
      startScreen.querySelector("h1").textContent = S("title");
      document.getElementById("saveBtn").textContent = S("save");
      document.getElementById("startBtn").textContent = S("start");
      document.getElementById("resetBtn").textContent = S("reset");
      homeBtn.textContent = S("home");
      var landingEl = document.getElementById("landing");
      landingEl.classList.toggle("en-ui", en);
      landingEl.querySelector("h1").textContent = S("title");
      document.getElementById("landingSub").textContent = S("tag");
      document.getElementById("enterBtn").textContent = S("enter");
      document.getElementById("backBtn").textContent = S("back");
      document.getElementById("guideBtn").textContent = S("guide");
      document.getElementById("guideTitle").textContent = S("guide");
      document.getElementById("guideClose").setAttribute("aria-label", S("close"));
      renderGuide();
      document.getElementById("es").style.display = lang.es ? "" : "none";
      renderStatus();
    }
    function openDeck() {
      card.classList.remove("is-flipped");
      startScreen.style.display = "none";
      wrapper.style.display = "";
      homeBtn.style.display = "";
      updateCard();
    }
    function goHome(msg) {
      wrapper.style.display = "none";
      homeBtn.style.display = "none";
      startScreen.style.display = "flex";
      buildDecks();
      refreshStatus(msg);
    }

    document.getElementById("startBtn").addEventListener("click", function () {
      setMode("main");
      if (!cards.length) { refreshStatus("allMoved"); return; }
      openDeck();
    });
    document.getElementById("saveBtn").addEventListener("click", function () {
      setMode("saved");
      if (!cards.length) { refreshStatus("noSaved"); return; }
      openDeck();
    });
    document.getElementById("resetBtn").addEventListener("click", function () {
      savedIds = [];
      persist();
      setMode("main");
      refreshStatus("reset");
    });
    homeBtn.addEventListener("click", function () { goHome(); });

    var toastEl = document.createElement("div");
    toastEl.style.cssText = "position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);transform:translateX(-50%);z-index:20;padding:12px 20px;border-radius:4px;background:#323232;color:#fff;font-size:0.9rem;font-weight:500;box-shadow:0 3px 5px rgba(0,0,0,.2);opacity:0;transition:opacity 0.2s ease;pointer-events:none;white-space:nowrap;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;";
    document.body.appendChild(toastEl);
    var toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.style.opacity = "1";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.style.opacity = "0"; }, 1200);
    }

    // 카드 위쪽을 탭하면: 천자문 -> 저장으로 이동, 저장 -> 천자문으로 되돌림
    function saveProgress() {
      if (!cards.length) return;
      var id = deckIds[index];
      if (mode === "main") savedIds.push(id);
      else savedIds = savedIds.filter(function (x) { return x !== id; });
      var ok = persist();
      deckIds.splice(index, 1);
      cards.splice(index, 1);
      showToast(ok ? (mode === "main" ? S("toSaved") : S("toMain")) : S("noPersist"));
      if (!cards.length) { goHome(mode === "main" ? "allMoved" : "noSaved"); return; }
      if (index >= cards.length) index = 0;
      card.classList.remove("is-flipped");
      updateCard();
    }

    var LKEY = "cheonjamun-lang";
    var lang = { ko: true, en: false };
    try {
      var lr = JSON.parse(localStorage.getItem(LKEY) || "null");
      if (lr && lr.es) lang = { ko: false, en: false, es: true };
      else if (lr && lr.en && !lr.ko) lang = { ko: false, en: true };
    } catch (e) {}
    function applyLang() {
      applyUI();
      [["langKo", "ko"], ["langEn", "en"], ["langEs", "es"]].forEach(function (p) {
        var b = document.getElementById(p[0]);
        b.classList.toggle("on", lang[p[1]]);
        b.setAttribute("aria-pressed", lang[p[1]] ? "true" : "false");
      });
    }
    function toggleLang(k) {
      lang = { ko: k === "ko", en: k === "en", es: k === "es" };
      try { localStorage.setItem(LKEY, JSON.stringify(lang)); } catch (e) {}
      applyLang();
    }
    document.getElementById("langKo").addEventListener("click", function () { toggleLang("ko"); });
    document.getElementById("langEn").addEventListener("click", function () { toggleLang("en"); });
    document.getElementById("langEs").addEventListener("click", function () { toggleLang("es"); });

    document.getElementById("enterBtn").addEventListener("click", function () {
      document.getElementById("landing").style.display = "none";
      startScreen.style.display = "flex";
    });
    document.getElementById("backBtn").addEventListener("click", function () {
      startScreen.style.display = "none";
      document.getElementById("landing").style.display = "flex";
    });

    document.getElementById("guideBtn").addEventListener("click", openGuide);
    document.getElementById("guideClose").addEventListener("click", closeGuide);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && document.getElementById("guide").style.display !== "none") closeGuide();
    });

    buildDecks();
    setMode("main");
    applyLang();
    updateCard();
    refreshStatus();
  </script>
</body>
</html>
